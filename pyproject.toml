[project]
name = "hl-archive-tools"
version = "0.1.0"
description = "Tools and measured field notes for Hyperliquid's public S3 archives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["boto3>=1.34", "lz4>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
